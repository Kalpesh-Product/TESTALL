version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd mern-app/frontend
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: mern-app/frontend/dist
    files:
      - "**/*"
  cache:
    paths:
      - mern-app/frontend/node_modules/**/*
